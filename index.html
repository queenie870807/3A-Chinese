<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三年级语文（上册）材料库</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#2b2e33; --muted:#8b929b;
    --line:#eceef1; --line2:#f2f4f6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:860px;margin:0 auto;padding:22px 20px 36px;}
  .eyebrow{font-size:12px;letter-spacing:3px;color:#9aa1a8;font-weight:600;}
  header h1{font-size:22px;margin:6px 0 4px;font-weight:700;letter-spacing:.5px;}
  .meta{color:var(--muted);font-size:12.5px;margin:0;}

  .cat{margin-top:20px;}
  .cat-head{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .cat-dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .cat-head h2{font-size:14px;margin:0;font-weight:700;color:#3a3f45;}
  .cat-head .cdesc{font-size:12px;color:var(--muted);}

  .list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .row{display:flex;flex-wrap:wrap;border-left:3px solid #ccc;border-bottom:1px solid var(--line2);}
  .row:last-child{border-bottom:none;}
  .row-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;
    padding:11px 14px;cursor:pointer;}
  .row-main:hover{background:#fafbfc;}
  .rtitle{font-size:14.5px;font-weight:600;flex:1;line-height:1.4;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rmeta{font-size:12px;color:var(--muted);white-space:nowrap;flex:none;}
  .rmeta .ans-ok{color:#2f8a4e;}
  .rmeta .ans-warn{color:#9a6b12;}
  .chev{font-size:12px;color:#b6bcc4;transition:transform .15s;flex:none;}
  .row.open .chev{transform:rotate(90deg);}
  .ropen{flex:none;align-self:center;margin-right:12px;font-size:12px;color:#3a6ea5;
    text-decoration:none;font-weight:500;padding:5px 12px;border:1px solid #dce8f5;
    border-radius:7px;background:#f3f8fd;}
  .ropen:hover{background:#e8f1fb;}
  .rdetail{flex-basis:100%;max-height:0;overflow:hidden;transition:max-height .2s ease;}
  .row.open .rdetail{max-height:260px;overflow:auto;}
  .rdetail-inner{padding:0 16px 13px 17px;font-size:13px;color:#5a6068;line-height:1.75;}
  .rdetail-inner .src{color:#7a818a;font-size:12px;margin-top:6px;}

  footer{margin-top:24px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);
    padding-top:12px;line-height:1.8;}
  footer b{color:#525863;}
  footer .removed{margin-top:6px;color:#aab0b7;}

  .dmeta{display:none;}   /* 手机端把「类型·页数·答案」移进展开面板 */

  /* 移动端：单行标题 + 描边小按钮，保证 8 条一屏排完；详情点开再看 */
  @media(max-width:600px){
    .wrap{padding:14px 12px 22px;}
    .eyebrow{font-size:11px;letter-spacing:2px;}
    header h1{font-size:19px;margin:5px 0 3px;}
    .meta{font-size:11.5px;}
    .cat{margin-top:14px;}
    .cat-head{margin-bottom:5px;}
    .cat-head h2{font-size:13px;}
    .row-main{padding:9px 12px;gap:8px;}
    .rtitle{font-size:13.5px;}
    .rmeta{display:none;}
    .chev{font-size:11px;}
    .ropen{margin-right:10px;padding:4px 10px;font-size:12px;
      background:transparent;border:1px solid #cfe0f2;border-radius:6px;color:#3a6ea5;}
    .ropen:hover{background:#f3f8fd;}
    .rdetail-inner{padding:0 14px 11px 15px;font-size:12.5px;}
    .dmeta{display:block;color:#7a818a;font-size:12px;margin-top:4px;}
    footer{margin-top:18px;font-size:11.5px;padding-top:10px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">三年级 · 上册</div>
  <header><h1>语文学习材料库</h1><p class="meta" id="meta"></p></header>

  <div id="cats"></div>

  <footer>
    <b>如何打开：</b>点击「打开」需在本地服务器或直接双击 <code>index.html</code> 时可用——最稳妥是从磁盘双击本页，相对链接天然有效。点击资料行可展开详情。
    <div class="removed">已从库移除（原件不可得）：句子排序、期中复习汇总、复课申请单、统编版课本、作文范文、四字词语预习、课课贴。</div>
  </footer>
</div>

<script>
const cats=[
 {key:'C1',name:'课本与课内基础',color:'#3f9e8c'},
 {key:'C2',name:'专项突破（字词句 / 标点病句）',color:'#e0905a'},
 {key:'C3',name:'阅读理解',color:'#5a8fd6'},
 {key:'C4',name:'作文',color:'#c77fb3'},
 {key:'C5',name:'期中复习与模拟卷',color:'#e0a83a'}
];
const items=[
 {cat:'C1',name:'26秋三上语文每课预习必背知识点',src:'公子升 / 小6看家（实取小6看家）',type:'课内基础 PDF',pages:'38 页',answer:'—',file:'meike_bixu_zhishidian.pdf',
  summary:'三上逐课预习必背知识点：按课梳理识字注音、词语听写、生字组词、近反义词、形近字、词语积累、句子仿写与课文主题，覆盖全册约 33 课。'},

 {cat:'C2',name:'三上语文期中重难点专项训练（标点符号+修改病句）含答案',src:'公子升',type:'专项 PDF',pages:'36 页',answer:'含答案',file:'zhuanxiang_biaodian_bingju_36ye.pdf',
  summary:'期中重难点专项：标点符号（提示语在前/中/后加标点规则与填空）+ 修改病句，附完整答案，共 36 页。'},
 {cat:'C2',name:'期中基础押题（10.31）',src:'公子升',type:'基础专项 PDF',pages:'约 3 页（图片版）',answer:'未标注',file:'jichu_yaoti_10.31.pdf',
  summary:'期中基础押题：按字音、字词填空、成语、偏旁（“口”字旁）分类归纳，含多音字、词语表与成语积累。'},

 {cat:'C3',name:'2026秋三上语文阅读理解考点与答题模板',src:'公子升',type:'阅读 PDF',pages:'97 页',answer:'—',file:'yuedu_kaojiao_muban_97ye.pdf',
  summary:'按三上 8 个单元梳理阅读考点 + 答题模板，并配阅读篇目（乡村小学、北大荒的秋天、拇指姑娘等），系统性强。'},
 {cat:'C3',name:'期中阅读押题（10.30）',src:'公子升',type:'阅读 / 习作 PDF',pages:'11 页',answer:'未标注',file:'yuedu_yaoti_10.30.pdf',
  summary:'期中阅读押题：含“梳理概括文章内容”等阅读题型与答题方法；首页另附单元习作（写人 / 记事 / 想象 / 童话）押题概览。'},

 {cat:'C5',name:'模拟1 · 过关模拟练习',src:'公子升',type:'模拟卷 DOCX',pages:'—',answer:'含评分',file:'moni1.docx',
  summary:'2026 学年第一学期三年级语文过关模拟练习 1：看拼音写词语、圈正确读音、古诗词默写等，带“等第 + 家长签名”过关格式。'},
 {cat:'C5',name:'模拟2 · 过关模拟练习',src:'公子升',type:'模拟卷 DOCX',pages:'—',answer:'含评分',file:'moni2.docx',
  summary:'过关模拟练习 2：题型同模拟 1（看拼音写词语、多音字、古诗词默写等）。'},
 {cat:'C5',name:'三上语文单项范围（期中·看拼音写词+多音字+古诗谚语）',src:'本地新增',type:'期中范围 PDF',pages:'2 页',answer:'—',file:'danxiang_fanwei.pdf',
  summary:'QWFLS 2026 学年第一学期三年级语文单项范围（期中）：① 看拼音写词语（两页词表，覆盖第一~三单元及“预测”单元重点词）；② 圈出加点字正确读音（多音字：挨/假/磨/挑/几/扇/背/晃/中/弹/吗）；③ 古诗与谚语默写（所见、山行、夜书所见、舟夜书所见、望洞庭，及《论语》《墨子》《孟子》《荀子》名句）。'}
];

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const catColor=k=>(cats.find(c=>c.key===k)||{}).color||'#ccc';
function ansCls(a){return (a==='含答案'||a==='含评分')?'ans-ok':(a==='未标注'?'ans-warn':'');}
function ansTxt(a){return a==='—'?'无答案':a;}

function row(it){
  const c=catColor(it.cat);
  return `<div class="row" style="border-left-color:${c}">
    <div class="row-main" onclick="this.parentElement.classList.toggle('open')">
      <span class="rtitle" title="${esc(it.name)}">${esc(it.name)}</span>
      <span class="rmeta">${esc(it.type)} · ${esc(it.pages)} · <span class="${ansCls(it.answer)}">${esc(ansTxt(it.answer))}</span></span>
      <span class="chev">▸</span>
    </div>
    <a class="ropen" href="./${it.file}" target="_blank" rel="noopener">打开</a>
    <div class="rdetail"><div class="rdetail-inner"><b style="color:#3a3f45">${esc(it.name)}</b><div class="dmeta">${esc(it.type)} · ${esc(it.pages)} · ${esc(ansTxt(it.answer))}</div><div style="margin-top:6px">${esc(it.summary)}</div><div class="src">来源：${esc(it.src)}</div></div></div>
  </div>`;
}

let html='';
cats.forEach(c=>{
  const list=items.filter(i=>i.cat===c.key);
  if(!list.length) return;
  html+=`<div class="cat">
    <div class="cat-head"><span class="cat-dot" style="background:${c.color}"></span>
      <h2>${esc(c.name)}</h2><span class="cdesc">${list.length} 份</span></div>
    <div class="list">${list.map(row).join('')}</div></div>`;
});
document.getElementById('cats').innerHTML=html;
const catCount=cats.filter(c=>items.some(i=>i.cat===c.key)).length;
document.getElementById('meta').textContent=`共 ${items.length} 份资料 · ${catCount} 个分类 · 更新于 2026-11-04`;
</script>
</body>
</html>
